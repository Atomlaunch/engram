[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "1.3.0"
description = "Jarvis persistent memory system — Obsidian-native, SQLite-indexed"
requires-python = ">=3.11"
dependencies = [
    "watchdog>=4.0",
    "python-frontmatter>=1.1",
    "click>=8.1",
    "anthropic>=0.40",
    "requests>=2.31",
]

[project.optional-dependencies]
# anthropic and requests are core (NUBIS-002): the default ingest path imports
# anthropic and the OpenAI-compatible path imports requests. Extras stay as
# no-op aliases so existing `engram[anthropic]` installs keep working.
anthropic = []
all = []
test = ["pytest>=8"]

[project.scripts]
engram = "engram.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["engram*"]
