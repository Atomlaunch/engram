name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (default deps, as users get them)
        run: python -m pip install -e ".[test]"
      - name: Default and alternate provider clients import
        run: python -c "import anthropic, requests, engram.ingest"
      - name: Tests
        run: python -m pytest -q tests
